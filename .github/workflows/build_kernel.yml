name: Build LineageOS Official Kernel

on:
  workflow_dispatch:
    inputs:
      boot_version:
        description: 'This option determines the LineageOS version used for extracting the.config file.'
        required: true
        default: '0731'
        type: string

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          repository: 'LineageOS/android_kernel_oneplus_sm4350'
          fetch-depth: 1

      - name: Get kernel commit SHA
        id: source_git_sga
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache NDK
        uses: actions/cache@v6
        with:
          path: android-ndk-r29
          key: ${{ runner.os }}-ndk-r29

      - name: Cache build output
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ runner.os }}-build-${{ steps.source_git_sha.outputs.sha }}-${{ inputs.boot_version }}
          restore-keys: ${{ runner.os }}-build-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio libncurses5-dev libssl-dev lz4
          if [ ! -d "android-ndk-r29" ]; then
            wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
            unzip android-ndk-r29-linux.zip
          fi
          echo "NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV
          echo "$PWD/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Download and Apply Patch
        run: |
          sudo apt-get update

      - name: Add KernelSU
        run: |
          sudo apt-get update

      - name: Extract .config from boot.img
        run: |
          wget https://mirrorbits.lineageos.org/full/dre/2026${{ inputs.boot_version }}/boot.img
          mkdir -p build
          ./scripts/extract-ikconfig boot.img | tee build/.config
          rm boot.img

      - name: Upload Config Before Build
        uses: actions/upload-artifact@v7
        with:
          name: config_origin
          path: build/.config
          include-hidden-files: true

      - name: Build Kernel
        run: |
          make O=build LLVM=1 \
            ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            -j$(nproc --all)

      - name: Upload Config After Build
        uses: actions/upload-artifact@v7
        with:
          name: config
          path: build/.config
          include-hidden-files: true

      - name: Upload Kernel
        uses: actions/upload-artifact@v7
        with:
          path: build/arch/arm64/boot/Image
          archive: false
